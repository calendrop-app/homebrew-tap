name: Update

# Calendrop's release runs this once the release holds the app, so the cask
# names the latest one.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cask:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: ./update-cask.sh
        env:
          # The app's repository is another one; this repository's token cannot
          # read its releases while it is private.
          GH_TOKEN: ${{ secrets.CALENDROP_RELEASES_TOKEN || github.token }}
      - name: Commit the cask
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/calendrop.rb
          git diff --cached --quiet || git commit -m "calendrop $(perl -ne 'print $1 if /^  version "(.+)"/' Casks/calendrop.rb)"
          git push
